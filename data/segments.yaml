# Revenue-segment attribution for the "split by revenue segment" toggle.
#
# Each multi-layer company maps its reported segments onto stack layers. `other` is a
# pseudo-layer for revenue outside the AI stack (e.g. Amazon retail, Starlink); it is shown
# as "outside the stack" and never added to a layer band. Shares must sum to 1 (checked).
# Companies not listed here are attributed 100% to their primary layer in both modes.
#
# Mapping choices are judgement calls and are documented in docs/methodology.md.

segments:
  - company_id: msft
    fiscal_year: FY2026 (to 2026-06-30)
    source_url: https://www.sec.gov/Archives/edgar/data/0000789019/000119312526323660/msft-20260630.htm
    notes: Sum of quarterly segment revenue ($bn) - P&BP 140.0, Intelligent Cloud 137.8, MPC 54.2.
    shares:
      apps: 0.4217    # Productivity & Business Processes (M365, LinkedIn, Dynamics)
      cloud: 0.4151   # Intelligent Cloud (Azure, server products)
      other: 0.1632   # More Personal Computing (Windows OEM, devices, gaming, search ads)

  - company_id: amzn
    fiscal_year: FY2025
    source_url: https://www.sec.gov/Archives/edgar/data/1018724/000101872426000004/amzn-20251231.htm
    notes: Net sales ($bn) - North America 426.3, International 161.9, AWS 128.7; total 716.9.
    shares:
      cloud: 0.1795
      other: 0.8205   # retail / ads / subscriptions

  - company_id: googl
    fiscal_year: FY2025
    source_url: https://www.sec.gov/Archives/edgar/data/1652044/000165204426000018/goog-20251231.htm
    notes: Revenue ($m) - Google Services 342,721; Google Cloud 58,705; Other Bets 1,537; hedging (127); total 402,836.
    shares:
      apps: 0.8508    # Google Services (Search, YouTube, subscriptions)
      cloud: 0.1457
      other: 0.0035   # Other Bets + hedging

  - company_id: meta
    fiscal_year: FY2025
    source_url: https://www.sec.gov/Archives/edgar/data/1326801/000162828026003942/meta-20251231.htm
    notes: Revenue ($m) - Family of Apps 198,759; Reality Labs 2,207; total 200,966.
    shares:
      apps: 0.9890
      other: 0.0110

  - company_id: spcx
    fiscal_year: FY2025
    source_url: https://www.sec.gov/Archives/edgar/data/1181412/000162828026036936/spaceexplorationtechnologi.htm
    notes: S-1 segment revenue ($m) - Connectivity 11,387; AI 3,201; Space 4,086; total 18,674. Cursor (acquired Aug 2026) not yet in these figures.
    shares:
      models: 0.1714  # AI segment (xAI / Grok / compute leasing)
      other: 0.8286   # Starlink + launch

  - company_id: samsung
    fiscal_year: FY2025
    source_url: https://news.samsung.com/global/samsung-electronics-announces-fourth-quarter-and-fy-2025-results
    notes: Total revenue KRW 333.6T; DS (semiconductor) ~KRW 130.1T = sum of quarterly DS revenue (25.1+27.9+33.1+44.0). Foundry is not reported separately from DS, so all DS is attributed to chips.
    shares:
      chips: 0.3900
      other: 0.6100   # DX (phones, appliances), display, Harman

  - company_id: intc
    fiscal_year: FY2025
    source_url: https://www.sec.gov/Archives/edgar/data/50863/000005086326000011/intc-20251227.htm
    notes: Revenue $52.9B; Intel Products ~49.1B (CCG 32.2 + DCAI 16.9); Intel Foundry external revenue $0.307B; remainder (Altera to Q3 deconsolidation, Mobileye, other) treated as other.
    shares:
      chips: 0.9282
      semicap: 0.0058
      other: 0.0660

  - company_id: dell
    fiscal_year: FY2026 (to 2026-01-30)
    source_url: https://www.sec.gov/Archives/edgar/data/1571996/000157199626000008/dell-20260130.htm
    notes: Revenue $113.5B; ISG 60.8B, CSG 51.0B, corporate/other 1.7B.
    shares:
      infra: 0.5357
      other: 0.4643
