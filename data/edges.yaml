# Dependency graph of the AI stack. Every edge is backed by evidence_url.
#
# Conventions (see docs/data_dictionary.md):
#   source_id -> target_id reads as "source <direction> target":
#     supplies_to  - source sells a product/service/power to target (money flows target -> source)
#     invests_in   - source holds equity (or an equity-linked instrument) in target
#   magnitude_usd is only set when a figure is publicly reported; otherwise null with
#   confidence: estimated and the reason in notes. Figures are face values as announced
#   (multi-year totals are NOT annualised here; magnitude_basis says what the number is).
#   stake_pct (equity_stake only) is a fraction in [0, 1] when reported, else null.

