# Latest disclosed valuations for private companies. When a company IPOs, set
# is_public: true + ticker in companies.yaml; its row here is then ignored.
#
# valuation is in `currency` (converted to USD by the pipeline at the as_of_date FX rate).
# Only CLOSED, priced rounds are used - reported talks (e.g. Anthropic at ~$2T IPO targets,
# Cohere at $20B, Perplexity at $30B) are deliberately excluded. Staleness is checked
# against `private_valuation_max_age_days` in config/pipeline.yaml (warn, not fail).

private_valuations:
  - company_id: openai
    valuation: 852000000000
    currency: USD
    basis: post_money
    as_of_date: 2026-03-31
    round: "2026 round ($122B committed)"
    source_url: https://www.cnbc.com/2026/03/31/openai-funding-round-ipo.html
    confidence: reported

