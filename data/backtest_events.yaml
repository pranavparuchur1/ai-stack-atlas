# Historical events used to backtest the propagation model (web Simulator -> Backtest tab).
#
# Each event is replayed with ONLY the edges whose evidence_date is on or before the event date
# (no look-ahead), and starting market caps from the close before the event. Predicted moves are
# compared with market-adjusted returns (stock minus SPY) over 1, 3 and 5 trading days.
#
# effective_date: first session that could react (next day for after-close announcements).

events:
  - id: anthropic_series_h
    name: Anthropic Series H at $965B
    date: 2026-05-28
    effective_date: 2026-05-28
    description: >-
      Anthropic closed a $65B Series H at $965B post-money, up from $380B at its Series G
      (2026-02-12). Talks at ~$900B were reported a month earlier (2026-04-29), so part of the
      move was likely priced in before the event window.
    source_url: https://www.cnbc.com/2026/05/28/anthropic-open-ai-startup-value.html
    prior_source_url: https://www.cnbc.com/2026/02/12/anthropic-closes-30-billion-funding-round-at-380-billion-valuation.html
    scenario:
      company_id: anthropic
      type: valuation_change
      pct: 1.5395            # 965 / 380 - 1
      prior_valuation_usd: 380000000000

  - id: openai_feb_2026_round
    name: OpenAI raises $110B at $730B pre-money
    date: 2026-02-27
    effective_date: 2026-02-27
    description: >-
      OpenAI announced a $110B round led by Amazon, NVIDIA and SoftBank at a $730B pre-money
      ($840B post-money) valuation, up from $500B at its October 2025 secondary sale.
    source_url: https://www.cnbc.com/2026/02/27/open-ai-funding-round-amazon.html
    prior_source_url: https://www.cnbc.com/2025/10/02/openai-share-sale-500-billion-valuation.html
    scenario:
      company_id: openai
      type: valuation_change
      pct: 0.68              # 840 / 500 - 1
      prior_valuation_usd: 500000000000

  - id: alphabet_capex_q2_2026
    name: Alphabet raises 2026 capex guidance
    date: 2026-07-22
    effective_date: 2026-07-23
    description: >-
      With Q2 results after the close on 2026-07-22, Alphabet raised 2026 capex guidance to
      $195-205B from $180-190B (+8.1% at the midpoint) - a demand shock for its suppliers.
    source_url: https://www.cnbc.com/2026/07/22/google-earnings-q2-goog-live-updates.html
    scenario:
      company_id: googl
      type: demand_shock
      pct: 0.0811            # 200 / 185 - 1
