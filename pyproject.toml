[project]
name = "ai-stack-atlas-pipeline"
version = "0.1.0"
description = "Data pipeline for AI Stack Atlas: prices, market caps, layer analytics and a cited dependency graph."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "yfinance>=1.7.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:yfinance.*"]

[tool.coverage.run]
source = ["pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR0915", "PLR2004", "PLR0912", "PLR0917", "PLC0415", "E741", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "B017", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pipeline"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
