<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Stack Atlas</title>
    <meta
      name="description"
      content="A near-real-time market map of the AI economy - power, data centers, chips, cloud, models and applications - with a cited dependency graph and a transparent shock simulator."
    />
    <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking first paint; system fallbacks render meanwhile -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600&display=optional"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600&display=optional"
    /></noscript>
    <script>
      // apply the saved theme before first paint (no flash); storage may be unavailable
      try {
        var t = localStorage.getItem("atlas.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
